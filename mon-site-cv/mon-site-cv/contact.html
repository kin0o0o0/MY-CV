<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mes contacts – MB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    
    /* --- SAME BACKGROUND AS OTHER PAGES --- */
    body{
      font-family:"Helvetica Neue",Arial,sans-serif;
      color:#000;
      background-image: url('img/home2.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.60);
      z-index: -1;
    }
    
    /* --- NAV & LAYOUT --- */
    nav{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #e5e5e5;padding:20px 30px;z-index:100;}
    nav ul{list-style:none;display:flex;gap:25px;}
    nav a{color:#000;text-decoration:none;font-size:.9rem;letter-spacing:.3px;}
    nav a:hover{opacity:.6;}
    
    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      min-height:100vh;
      position:relative;
      z-index:1;
    }
    
    /* --- CONTACT CARD (like cv.html container) --- */
    .card{
      max-width:600px;
      width:100%;
      background: rgba(255, 255, 255, 0.92);
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align:center;
    }
    
    h1{margin-bottom:30px;font-size:2rem;font-weight:500;}
    
    /* --- ICON GRID --- */
    .contact-gallery{
      display:flex;
      gap:30px;
      flex-wrap:wrap;
      justify-content:center;
    }
    
    .contact-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      cursor:pointer;
      padding:20px;
      border-radius:8px;
      background:rgba(255,255,255,0.7);
      transition:background-color 0.3s ease, transform 0.3s ease;
      min-width:120px;
    }
    
    .contact-item:hover{
      background:rgba(255,255,255,0.9);
      transform:translateY(-3px);
    }
    
    .contact-item .icon{
      width:48px;
      height:48px;
      color:#000;
      transition:transform 0.3s ease;
    }
    
    .contact-item:hover .icon{
      transform:scale(1.1);
    }
    
    /* --- INFO: HIDDEN BY DEFAULT --- */
    .contact-item .info{
      margin-top:10px;
      text-align:center;
      opacity:0;
      max-height:0;
      overflow:hidden;
      transition:opacity 0.4s ease, max-height 0.4s ease, margin-top 0.4s ease;
    }
    
    .contact-item.clicked .info{
      opacity:1;
      max-height:80px;
      margin-top:15px;
    }
    
    .contact-item .info .label{
      display:block;
      font-weight:500;
      font-size:0.9rem;
      color:#333;
    }
    
    .contact-item .info .value{
      display:block;
      font-size:0.85rem;
      color:#555;
      margin-top:4px;
      word-break:break-all;
    }
    
    .home-fixe{position:fixed;bottom:12px;right:12px;width:80px;opacity:.8;transition:opacity .2s;z-index:200;}
    .home-fixe:hover{opacity:1;}
  </style>
</head>

  <script>
    // Close expanded items when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.contact-item') && !e.target.closest('.card')) {
        document.querySelectorAll('.contact-item.clicked').forEach(item => {
          item.classList.remove('clicked');
        });
      }
      // If clicking inside card but not on an item, also close all
      if (e.target.closest('.card') && !e.target.closest('.contact-item')) {
        document.querySelectorAll('.contact-item.clicked').forEach(item => {
          item.classList.remove('clicked');
        });
      }
    });
  </script>
