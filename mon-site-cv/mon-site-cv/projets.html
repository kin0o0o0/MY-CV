<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mes projets – MB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    
    /* --- SAME BACKGROUND AS VILLE --- */
    body{
      font-family:"Helvetica Neue",Arial,sans-serif;
      color:#000;
      background-image: url('img/home2.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    
    /* --- LIGHTER OVERLAY FOR BETTER VISIBILITY --- */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.60);
      z-index: -1;
    }
    
    /* --- NAV & LAYOUT --- */
    nav{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #e5e5e5;padding:20px 30px;z-index:100;}
    nav ul{list-style:none;display:flex;gap:25px;}
    nav a{color:#000;text-decoration:none;font-size:.9rem;letter-spacing:.3px;}
    nav a:hover{opacity:.6;}
    .container{max-width:900px;margin:90px auto 60px;padding:0 30px;position:relative;z-index:1;}
    
    /* --- CENTERED TITLE --- */
    h1{margin-bottom:30px;font-size:2rem;font-weight:500;text-align:center;}
    
    .home-fixe{position:fixed;bottom:12px;right:12px;width:80px;opacity:.8;transition:opacity .2s;}
    .home-fixe:hover{opacity:1;}

    /* --- SIDE-BY-SIDE PROJECTS (same as ville gallery) --- */
    .gallery{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
    
    figure{width:280px;position:relative;overflow:hidden;border-radius:8px;cursor:pointer;aspect-ratio:1/1;background:#f0f0f0;}
    
    figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s ease;}
    figure:hover img{transform:scale(1.05);}
    
    /* --- CAPTION: hidden, shown on click only --- */
    figcaption{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.9);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:25px;
      opacity:0;
      transition:opacity 0.4s ease;
      font-size:0.95rem;
      line-height:1.4;
      pointer-events: none; /* Prevent caption from blocking clicks */
    }
    
    figure.clicked figcaption{opacity:1;}
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="cv.html">Mon CV</a></li>
      <li><a href="ville.html">Ma ville</a></li>
      <li><a href="projets.html" aria-current="page">Mes projets</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Mes projets</h1>
    
    <div class="gallery">


      <!-- Project 2 -->
      <figure onclick="this.classList.toggle('clicked')">
        <img src="img/projet2.jpeg" alt="Application Android">
        <figcaption>
          <strong>Mon Site CV</strong><br>
          CE SITE
        </figcaption>
      </figure>

      <!-- Project 3 -->
      <figure onclick="this.classList.toggle('clicked')">
        <img src="img/projet3.jpeg" alt="Réseau social">
        <figcaption>
          <strong>2025 – YouTube cloun</strong><br>
         J'ai créé un mini-site similaire à YouTube.
        </figcaption>
      </figure>

      <!-- Project 4 -->
      <figure onclick="this.classList.toggle('clicked')">
        <img src="img/projet4.jpeg" alt="Portfolio photo">
        <figcaption>
          <strong>2025 – Portfolio photo</strong><br>
          i maked a portfolio photo on Gethub Pages
        </figcaption>
      </figure>

      <!-- Project 5 -->
      <figure onclick="this.classList.toggle('clicked')">
        <img src="img/projet5.jpeg" alt="Script Python">
        <figcaption>
          <strong>2023 – Boot Telegram</strong><br>
          J'ai réussi Boot sur une plateforme de Telegram
        </figcaption>
      </figure>

      <!-- Project 6 -->
      <figure onclick="this.classList.toggle('clicked')">
        <img src="img/projet6.jpeg" alt="Bot Discord">
        <figcaption>
          <strong>2022 – Bot Discord</strong><br>
          J'ai réussi Boot sur une plateforme de Discord
        </figcaption>
      </figure>
    </div>
  </div>

  <a href="index.html"><img src="img/home.png" alt="home" class="home-fixe"></a>

  <script>
    // Close expanded projects when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('figure')) {
        document.querySelectorAll('figure.clicked').forEach(f => {
          f.classList.remove('clicked');
        });
      }
    });
  </script>
</body>
</html>
